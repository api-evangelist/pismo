aid: pismo
url: https://raw.githubusercontent.com/api-evangelist/pismo/refs/heads/main/apis.yml
name: Pismo
kind: company
description: Pismo is a cloud-native issuer-processing and core-banking platform exposing
  REST APIs for accounts, customers, cards, authorizations, transactions, statements,
  and programs, plus an event stream (Kafka-backed, delivered via webhooks and cloud
  event buses). Acquired by Visa in January 2024, Pismo powers card issuing and
  digital banking for financial institutions across the Americas, Europe, and APAC.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Banking
- Card Issuing
- Payments
- Fintech
- Core Banking
- Cloud Native
